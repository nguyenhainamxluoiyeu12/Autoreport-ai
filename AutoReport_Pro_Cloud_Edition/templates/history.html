
<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>Lịch sử báo cáo</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"></head><body>
<main class="history-page"><div class="history-top"><div><h1>Lịch sử báo cáo</h1><p>Tải lại Word/PDF đã tạo.</p></div><a class="link-btn" href="/app">← Dashboard</a></div><div class="history-table"><div class="row head"><span>Tiêu đề</span><span>Loại</span><span>Người lập</span><span>Thời gian</span><span>Tải</span></div>{% for r in reports %}<div class="row"><span>{{ r.title }}</span><span>{{ r.report_type }}</span><span>{{ r.author or "..." }}</span><span>{{ r.created_at.strftime('%d/%m/%Y') }}</span><span><a href="/download/docx/{{ r.docx_filename }}">Word</a> | <a href="/download/pdf/{{ r.pdf_filename }}">PDF</a></span></div>{% else %}<div class="row"><span>Chưa có báo cáo</span><span></span><span></span><span></span><span></span></div>{% endfor %}</div></main></body></html>
